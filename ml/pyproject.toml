[project]
name = "atom-ml"
version = "0.1.0"
description = "Learned student, memory and tutor-reliability models for Atom (LAMA), trained and evaluated on public learning data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "httpx>=0.27",
    "tabulate>=0.9",
    "numba>=0.68.0",
    "lightgbm>=4.7.0",
]

[project.scripts]
atomml = "atomml.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atomml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]
